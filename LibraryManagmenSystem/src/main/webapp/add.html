<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Library Management - Add Book</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f6f9;
}

.navbar{
    background:#1e3a8a;
    color:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.navbar h2{
    margin:0;
}

.navbar a{
    color:white;
    text-decoration:none;
    margin-left:15px;
    font-size:14px;
}

.container{
    display:flex;
    justify-content:center;
    margin-top:60px;
}

.form-card{
    background:white;
    padding:35px;
    width:400px;
    border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.form-card h3{
    margin-bottom:20px;
    text-align:center;
    color:#1e3a8a;
}

.input-field{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
}

.btn{
    width:100%;
    padding:10px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
    margin-top:15px;
}

.btn:hover{
    background:#1e40af;
}
</style>

</head>
<body>

<div class="navbar">
    <h2>Library Management - Admin Panel</h2>
    <div>
        <a href="dashboard">Dashboard</a>
        <a href="logout">Logout</a>
    </div>
</div>

<div class="container">
    <div class="form-card">
        <h3>Add New Book</h3>

        <form action="add" method="post">
            <input type="text" name="bookid" placeholder="Book ID" class="input-field" required>

            <input type="text" name="bookname" placeholder="Book Name" class="input-field" required>

            <input type="text" name="bookauthor" placeholder="Author Name" class="input-field" required>

            <input type="number" name="bookprice" placeholder="Book Price" class="input-field" required>

            <input type="submit" value="Add Book" class="btn">
        </form>
    </div>
</div>

</body>
</html>
