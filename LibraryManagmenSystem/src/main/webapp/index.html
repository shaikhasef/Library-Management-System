<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Library Management - Admin Login</title>

<style>
body{
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction: column;
}

.login-container{
    background:white;
    padding:40px;
    width:350px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
}

.login-container h2{
    margin-bottom:25px;
    color:#1e3a8a;
}

.input-field{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
}

.btn{
    width:100%;
    padding:10px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
    margin-top:15px;
}

.btn:hover{
    background:#1e40af;
}

.register-link{
    display:block;
    margin-top:20px;
    text-decoration:none;
    color:#2563eb;
    font-size:14px;
}

.register-link:hover{
    text-decoration:underline;
}
</style>

</head>
<body>

<div class="login-container">
    <h2>Admin Login</h2>
    
    <form action="login" method="post">
        <input type="text" name="name" placeholder="Enter Admin Name" class="input-field" required>
        
        <input type="password" name="pass" placeholder="Enter Password" class="input-field" required>
        
        <input type="submit" value="Login" class="btn">
    </form>
    
    <a href="register.html" class="register-link">Create New Account</a>
</div>

</body>
</html>
