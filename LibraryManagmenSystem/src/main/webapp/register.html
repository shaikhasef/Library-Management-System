<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Library Management - Admin Register</title>

<style>
body{
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.register-container{
    background:white;
    padding:35px;
    width:380px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
}

.register-container h2{
    margin-bottom:20px;
    color:#1e3a8a;
}

.input-field{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
}

.btn{
    width:100%;
    padding:10px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
    margin-top:15px;
}

.btn:hover{
    background:#1e40af;
}

.login-link{
    display:block;
    margin-top:18px;
    text-decoration:none;
    color:#2563eb;
    font-size:14px;
}

.login-link:hover{
    text-decoration:underline;
}
</style>

</head>
<body>

<div class="register-container">
    <h2>Create Admin Account</h2>

    <form action="register" method="post">
        <input type="text" name="name" placeholder="Username" class="input-field" required>

        <input type="password" name="pass" placeholder="Password" class="input-field" required>

        <input type="text" name="fname" placeholder="First Name" class="input-field" required>

        <input type="text" name="lname" placeholder="Last Name" class="input-field" required>

        <input type="email" name="mail" placeholder="Email Address" class="input-field" required>

        <input type="tel" name="num" placeholder="Phone Number" class="input-field" required>

        <input type="submit" value="Register" class="btn">
    </form>

    <a href="login.html" class="login-link">Already have an account? Login</a>
</div>

</body>
</html>
